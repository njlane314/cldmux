name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC C++17
            os: ubuntu-24.04
            cxx: g++
            standard: c++17
            packages: libcurl4-openssl-dev
            sanitise: true
          - name: GCC C++20
            os: ubuntu-24.04
            cxx: g++
            standard: c++20
            packages: libcurl4-openssl-dev
            sanitise: false
          - name: GCC C++23
            os: ubuntu-24.04
            cxx: g++
            standard: c++23
            packages: libcurl4-openssl-dev
            sanitise: false
          - name: Clang C++17
            os: macos-15
            cxx: clang++
            standard: c++17
            packages: ''
            sanitise: false
          - name: Clang C++20
            os: macos-15
            cxx: clang++
            standard: c++20
            packages: ''
            sanitise: false
          - name: Clang C++23
            os: macos-15
            cxx: clang++
            standard: c++23
            packages: ''
            sanitise: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: matrix.standard != 'c++17'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: njlane314/tst
          ref: 5207356c975006aa20c5b70dc61a5e2f553e50ee
          path: .deps/tst
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}
      - run: >-
          make check
          CXX=${{ matrix.cxx }}
          CXX_STANDARD=${{ matrix.standard }}
          TST_DIR=.deps/tst
      - if: runner.os == 'Linux' && matrix.standard == 'c++17'
        name: Verify stripped Linux binary
        run: |
          make dispatch-linux CXX=${{ matrix.cxx }} CXX_STANDARD=${{ matrix.standard }}
          file build/bin/linux/cldmux-dispatch | grep -q 'stripped'
          build/bin/linux/cldmux-dispatch --help >/dev/null
      - if: runner.os == 'macOS' && matrix.standard == 'c++17'
        name: Verify universal macOS release structure
        run: make check-release-macos CXX=${{ matrix.cxx }} CXX_STANDARD=${{ matrix.standard }}
      - if: matrix.sanitise
        run: >-
          make sanitise
          CXX=${{ matrix.cxx }}
          CXX_STANDARD=${{ matrix.standard }}
          TST_DIR=.deps/tst

  windows:
    name: MinGW UCRT64 C++17
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Preserve LF source files
        shell: pwsh
        run: git config --global core.autocrlf input
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: UCRT64
          install: >-
            make
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-gcc
      - name: Build and test Windows dispatcher
        shell: msys2 {0}
        run: |
          set -euo pipefail
          test "$MSYSTEM" = UCRT64
          test "$(g++ -dumpmachine)" = x86_64-w64-mingw32
          make check-dispatch CXX=g++ CXX_STANDARD=c++17
          make dispatch-windows CXX=g++ CXX_STANDARD=c++17
          binary=build/bin/windows/cldmux-dispatch.exe
          objdump -f "$binary" >build/check/windows-file.txt
          grep -q 'file format pei-x86-64' build/check/windows-file.txt
          ! grep -q HAS_SYMS build/check/windows-file.txt
          objdump -h "$binary" >build/check/windows-sections.txt
          ! grep -Eq '[.]debug' build/check/windows-sections.txt
          objdump -p "$binary" >build/check/windows-imports.txt
          ! grep -qi 'DLL Name: msys-2[.]0[.]dll' build/check/windows-imports.txt
          "$binary" --help >/dev/null
          powershell.exe -NoProfile -ExecutionPolicy Bypass \
            -File "$(cygpath -w tests/dispatch-windows.ps1)" \
            -Binary "$(cygpath -w "$binary")"

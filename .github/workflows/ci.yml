name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC C++17
            os: ubuntu-24.04
            cxx: g++
            standard: c++17
            packages: libcurl4-openssl-dev
            sanitise: true
          - name: GCC C++20
            os: ubuntu-24.04
            cxx: g++
            standard: c++20
            packages: libcurl4-openssl-dev
            sanitise: false
          - name: GCC C++23
            os: ubuntu-24.04
            cxx: g++
            standard: c++23
            packages: libcurl4-openssl-dev
            sanitise: false
          - name: Clang C++17
            os: macos-15
            cxx: clang++
            standard: c++17
            packages: ''
            sanitise: false
          - name: Clang C++20
            os: macos-15
            cxx: clang++
            standard: c++20
            packages: ''
            sanitise: false
          - name: Clang C++23
            os: macos-15
            cxx: clang++
            standard: c++23
            packages: ''
            sanitise: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: matrix.standard != 'c++17'
        uses: actions/checkout@v7
        with:
          repository: njlane314/tst
          ref: 5207356c975006aa20c5b70dc61a5e2f553e50ee
          path: .deps/tst
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}
      - run: >-
          make check
          CXX=${{ matrix.cxx }}
          CXX_STANDARD=${{ matrix.standard }}
          TST_DIR=.deps/tst
      - if: matrix.sanitise
        run: >-
          make sanitise
          CXX=${{ matrix.cxx }}
          CXX_STANDARD=${{ matrix.standard }}
          TST_DIR=.deps/tst
